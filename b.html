<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bueno</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
  :root{
    --ground:#FAF7F2; --surface:#FFFFFF; --ink:#201B16; --ink-2:#5C544A;
    --line:#E4DCD0; --accent:#E8850C; --steel:#33566B; --open:#2E7D4F;
    --stamp:#C0392B; --plate:#F3EDE3;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#16130F; --surface:#211D17; --ink:#F2EDE6; --ink-2:#AEA396;
      --line:#3A332A; --steel:#8FB3C9; --open:#5CBF8A; --stamp:#E4685A; --plate:#2C261E;
    }
  }
  :root[data-theme="dark"]{
    --ground:#16130F; --surface:#211D17; --ink:#F2EDE6; --ink-2:#AEA396;
    --line:#3A332A; --steel:#8FB3C9; --open:#5CBF8A; --stamp:#E4685A; --plate:#2C261E;
  }
  *{box-sizing:border-box; margin:0}
  body{background:var(--ground); color:var(--ink); font-family:"Barlow",system-ui,-apple-system,sans-serif; font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased; min-height:100vh}
  .page{max-width:430px; margin:0 auto; padding:14px 16px 28px; display:flex; flex-direction:column; gap:14px}

  .ticket{background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden}
  .ticket__top{padding:18px 18px 14px; display:flex; flex-direction:column; gap:10px}
  .shopname{font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:700; font-size:34px; line-height:1; text-wrap:balance}
  .shopname small{display:block; font-family:"Barlow",sans-serif; font-weight:500; font-size:13px; letter-spacing:.14em; color:var(--ink-2); margin-top:6px; text-transform:uppercase}
  .stamp{align-self:flex-start; font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:15px; letter-spacing:.1em; color:var(--stamp); border:2px solid var(--stamp); border-radius:6px; padding:3px 10px; transform:rotate(-2deg)}
  .ticket__msg{padding:0 18px 16px; color:var(--ink-2); font-size:15.5px}
  .tear{border-top:2px dashed var(--line)}
  .status{display:flex; align-items:center; gap:8px; padding:12px 18px; font-size:14px; font-weight:500}
  .status .dot{width:9px; height:9px; border-radius:50%; background:var(--open); flex:none}
  .status.closed .dot{background:var(--stamp)}

  .actions{display:flex; flex-direction:column; gap:10px}
  .card{display:flex; align-items:center; gap:14px; width:100%; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; text-align:left; text-decoration:none; color:var(--ink); font:inherit; cursor:pointer}
  .card:active{transform:translateY(1px)}
  .card:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  .plate{width:52px; height:52px; border-radius:10px; background:var(--plate); display:flex; align-items:center; justify-content:center; flex:none; color:var(--steel)}
  .card--primary .plate{background:var(--accent); color:#231303}
  .card h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:600; font-size:22px; letter-spacing:.03em; line-height:1.1}
  .card p{font-size:13.5px; color:var(--ink-2); margin-top:2px}
  .card svg{width:26px; height:26px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}

  .hours{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px}
  .hours h3{font-family:"Barlow Condensed",sans-serif; font-weight:600; font-size:17px; letter-spacing:.08em; color:var(--ink-2); margin-bottom:8px}
  .hours table{width:100%; border-collapse:collapse; font-size:14.5px}
  .hours td{padding:3px 0; font-variant-numeric:tabular-nums}
  .hours td:last-child{text-align:right; color:var(--ink-2)}
  .hours tr.today td{font-weight:600; color:var(--ink)}

  .foot{text-align:center; font-size:12px; color:var(--ink-2); padding-top:4px}
  .foot b{letter-spacing:.06em}

  .sheet-wrap{position:fixed; inset:0; background:rgba(20,16,10,.45); display:flex; align-items:flex-end; justify-content:center; z-index:10}
  .sheet-wrap[hidden]{display:none}
  .sheet{width:100%; max-width:430px; background:var(--surface); border-radius:16px 16px 0 0; border:1px solid var(--line); border-bottom:0; padding:18px 18px 26px; display:flex; flex-direction:column; gap:14px}
  .sheet-head{display:flex; align-items:center; justify-content:space-between}
  .sheet-head h2{font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:24px; letter-spacing:.02em}
  .sheet-head button{border:0; background:var(--plate); color:var(--ink-2); width:34px; height:34px; border-radius:8px; font-size:17px; cursor:pointer}
  .sheet-head button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .fieldlabel{font-size:13px; font-weight:600; color:var(--ink-2); letter-spacing:.04em; text-transform:uppercase; margin-bottom:8px}
  .chiprow{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px}
  .chip{border:1px solid var(--line); background:var(--ground); color:var(--ink); border-radius:999px; padding:9px 16px; font:inherit; font-size:14.5px; cursor:pointer; font-variant-numeric:tabular-nums}
  .chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#231303; font-weight:600}
  .chip:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .sheet textarea{width:100%; min-height:80px; resize:vertical; border:1px solid var(--line); border-radius:10px; background:var(--ground); color:var(--ink); font:inherit; font-size:15px; padding:12px}
  .sheet textarea:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  .send{border:0; border-radius:10px; background:var(--accent); color:#231303; font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:20px; letter-spacing:.05em; padding:14px; cursor:pointer; width:100%}
  .send:focus-visible{outline:3px solid var(--steel); outline-offset:2px}
  .attach{display:flex; align-items:center; gap:8px; border:1px dashed var(--line); border-radius:10px; padding:10px 14px; background:none; color:var(--ink-2); font:inherit; font-size:14px; cursor:pointer; margin-top:10px}
  .attach.added{color:var(--open); border-style:solid}
  .attach:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .success{display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; padding:12px 0 6px}
  .success[hidden]{display:none}
  .success .big{font-size:40px; color:var(--open)}
  .success h2{font-family:"Barlow Condensed",sans-serif; font-size:24px}
  .success p{color:var(--ink-2); font-size:14.5px}
  .err{color:var(--stamp); font-size:13.5px; margin-top:8px}
  .err[hidden]{display:none}

  .missing{max-width:430px; margin:60px auto; padding:24px; text-align:center; color:var(--ink-2)}
  .missing code{background:var(--plate); padding:2px 6px; border-radius:5px; color:var(--ink)}

  @media (prefers-reduced-motion: no-preference){
    .card{animation:rise .3s ease both}
    @keyframes rise{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  }
</style>

<div id="app"></div>

<script src="/shops.js"></script>
<script>
(function () {
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };

  /* ---- which shop? b.html?s=slug, or /b/slug once Railway routes it ---- */
  var slug = new URLSearchParams(location.search).get("s");
  if (!slug) {
    var m = location.pathname.match(/\/b\/([^\/?#]+)/);
    if (m) slug = m[1];
  }
  var shop = slug && window.SHOPS[slug];

  if (!shop) {
    document.getElementById("app").innerHTML =
      '<div class="missing"><p>No shop selected.</p><p style="margin-top:10px">Try <code>b.html?s=marinos-auto</code>, ' +
      '<code>b.html?s=js-finest</code> or <code>b.html?s=taqueria-lupita</code>.</p></div>';
    return;
  }

  var T = window.LANG[shop.lang || "en"];
  document.title = shop.name + " — Bueno";
  if (shop.accent) document.documentElement.style.setProperty("--accent", shop.accent);

  /* ---- hours: build the live open/closed line from the config ---- */
  var fmt = function (mins) {
    var h = Math.floor(mins / 60), am = h < 12;
    h = h % 12 || 12;
    return h + ":" + ("0" + (mins % 60)).slice(-2) + " " + (am ? "AM" : "PM");
  };
  var todaySpan = function () {
    var d = new Date().getDay();
    if (d === 0) return shop.hours && shop.hours.sun;
    if (d === 6) return shop.hours && shop.hours.sat;
    return shop.hours && shop.hours.weekday;
  };
  var statusLine = function () {
    var span = todaySpan();
    if (!span) return { open: false, text: T.closedNow };
    var now = new Date(), mins = now.getHours() * 60 + now.getMinutes();
    if (mins >= span[0] && mins < span[1]) return { open: true, text: T.openNow + fmt(span[1]) };
    return { open: false, text: T.closedNow };
  };

  /* ---- action cards ---- */
  var ICON = {
    book: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    callback: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
    quote: '<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0l-7.2-7.2V3h10.4l6.8 6.8a2 2 0 0 1 0 2.8z"/><circle cx="8" cy="8" r="1.6"/>',
    text: '<path d="M21 12a8 8 0 0 1-8 8H4l2.5-2.7A8 8 0 1 1 21 12z"/>',
    directions: '<path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/>',
  };
  var card = function (key, i) {
    var t = T[key], primary = i === 0 ? " card--primary" : "";
    var sub = key === "directions"
      ? esc(shop.address || "") + (shop.addressNote ? " — " + esc(shop.addressNote) : "")
      : esc(t[1]);
    var inner =
      '<span class="plate"><svg viewBox="0 0 24 24" aria-hidden="true">' + ICON[key] + "</svg></span>" +
      "<span><h2>" + esc(t[0]) + "</h2><p>" + sub + "</p></span>";
    if (key === "text" && shop.phone)
      return '<a class="card' + primary + '" href="sms:' + esc(shop.phone) + '">' + inner + "</a>";
    if (key === "directions")
      return '<a class="card' + primary + '" target="_blank" rel="noopener" href="https://maps.google.com/?q=' +
        encodeURIComponent((shop.address || "") + " " + shop.name) + '">' + inner + "</a>";
    return '<button type="button" class="card' + primary + '" data-sheet="' + key + '">' + inner + "</button>";
  };

  var st = statusLine();
  var acts = shop.actions || ["callback", "text", "directions"];
  var hoursRows = "";
  if (shop.hours) {
    var d = new Date().getDay();
    var row = function (label, span, isToday) {
      return '<tr class="' + (isToday ? "today" : "") + '"><td>' + esc(label) + "</td><td>" +
             (span ? fmt(span[0]) + " – " + fmt(span[1]) : esc(T.closed)) + "</td></tr>";
    };
    hoursRows = row(T.weekday, shop.hours.weekday, d >= 1 && d <= 5) +
                row(T.sat, shop.hours.sat, d === 6) +
                row(T.sun, shop.hours.sun, d === 0);
  }

  document.getElementById("app").innerHTML =
    '<div class="page">' +
      '<header class="ticket">' +
        '<div class="ticket__top">' +
          '<span class="stamp">' + esc(T.stamp) + "</span>" +
          '<h1 class="shopname">' + esc(shop.name) +
            (shop.trade ? "<small>" + esc(shop.trade) + "</small>" : "") +
          "</h1>" +
        "</div>" +
        (shop.message ? '<p class="ticket__msg">' + esc(shop.message) + "</p>" : "") +
        '<div class="tear"></div>' +
        '<div class="status' + (st.open ? "" : " closed") + '"><span class="dot"></span><span>' + esc(st.text) + "</span></div>" +
      "</header>" +
      '<nav class="actions">' + acts.map(card).join("") + "</nav>" +
      (hoursRows ? '<section class="hours"><h3>' + esc(T.hoursTitle) + "</h3><table>" + hoursRows + "</table></section>" : "") +
      '<p class="foot">' + esc(T.poweredBy) + " <b>BUENO</b></p>" +
    "</div>" +
    '<div class="sheet-wrap" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">' +
      '<div class="sheet">' +
        '<div class="sheet-head"><h2 id="sheetTitle"></h2><button type="button" id="sheetClose" aria-label="Close">✕</button></div>' +
        '<div id="sheetBody"></div>' +
        '<div class="success" id="sheetOk" hidden><span class="big">✓</span><h2 id="okTitle"></h2><p id="okBody"></p></div>' +
      "</div>" +
    "</div>";

  /* ---- sheets: book / callback / quote ---- */
  var sheet = $("#sheet"), body = $("#sheetBody"), ok = $("#sheetOk"), title = $("#sheetTitle");
  var chips = function (label, items, activeIdx, group) {
    return '<div class="fieldlabel">' + esc(label) + "</div><div class=\"chiprow\" data-group=\"" + group + '">' +
      items.map(function (x, i) {
        return '<button type="button" class="chip" aria-pressed="' + (i === activeIdx) + '">' + esc(x) + "</button>";
      }).join("") + "</div>";
  };

  // Every request needs a callback number — the owner has to reach them.
  var contact = function () {
    return '<div class="fieldlabel">' + esc(T.yourInfo) + "</div>" +
      '<input id="cName" placeholder="' + esc(T.namePh) + '" aria-label="' + esc(T.namePh) + '">' +
      '<div style="height:8px"></div>' +
      '<input id="cPhone" type="tel" inputmode="tel" placeholder="' + esc(T.phonePh) + '" aria-label="' + esc(T.phonePh) + '">' +
      '<p class="err" id="cErr" hidden></p><div style="height:14px"></div>';
  };

  var build = {
    book: function () {
      return chips(T.pickDay[0] + " / " + T.pickDay[1], T.pickDay, 0, "day") +
        (shop.barbers ? chips(T.whoWith, shop.barbers, 0, "who") : "") +
        chips("", shop.slots || [], 0, "slot") +
        contact() +
        '<button type="button" class="send" data-send="book">' + esc(T.sendBook) + "</button>";
    },
    callback: function () {
      return chips(T.cbWhen, T.cbOptions, 0, "when") +
        '<div class="fieldlabel">' + esc(T.cbNote) + "</div>" +
        '<textarea id="cbNote" aria-label="' + esc(T.cbNote) + '"></textarea>' +
        '<div style="height:14px"></div>' + contact() +
        '<button type="button" class="send" data-send="callback">' + esc(T.sendCb) + "</button>";
    },
    quote: function () {
      return '<textarea id="qText" placeholder="' + esc(shop.quoteHint || "") + '" aria-label="Describe the problem"></textarea>' +
        '<p class="err" id="qErr" hidden></p>' +
        (shop.photoUpload ? '<button type="button" class="attach" id="attach">📷 <span>' + esc(T.addPhoto) + "</span></button>" : "") +
        '<div style="height:14px"></div>' + contact() +
        '<button type="button" class="send" data-send="quote">' + esc(T.sendQuote) + "</button>";
    },
  };

  var openSheet = function (key) {
    title.textContent = T[key][0];
    body.innerHTML = build[key]();
    body.hidden = false; ok.hidden = true;
    sheet.hidden = false;
    document.body.style.overflow = "hidden";
    $("#sheetClose").focus();
  };
  var shut = function () { sheet.hidden = true; document.body.style.overflow = ""; };

  document.querySelectorAll("[data-sheet]").forEach(function (b) {
    b.addEventListener("click", function () { openSheet(b.getAttribute("data-sheet")); });
  });
  $("#sheetClose").addEventListener("click", shut);
  sheet.addEventListener("click", function (e) { if (e.target === sheet) shut(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !sheet.hidden) shut(); });

  body.addEventListener("click", function (e) {
    var chip = e.target.closest(".chip");
    if (chip) {
      var row = chip.parentElement;
      row.querySelectorAll(".chip").forEach(function (o) { o.setAttribute("aria-pressed", "false"); });
      chip.setAttribute("aria-pressed", "true");
      return;
    }
    if (e.target.id === "attach" || e.target.closest("#attach")) {
      var a = $("#attach");
      a.classList.add("added");
      $("span", a).textContent = T.photoAdded;
      return;
    }
    var send = e.target.closest("[data-send]");
    if (!send) return;
    var kind = send.getAttribute("data-send");

    // Quote needs an actual description before it goes anywhere.
    if (kind === "quote") {
      var txt = $("#qText"), err = $("#qErr");
      if (!txt.value.trim()) {
        err.textContent = shop.lang === "es" ? "Escribe qué necesitas primero." : "Tell us what's wrong first.";
        err.hidden = false;
        txt.focus();
        return;
      }
    }
    // A callback number is the whole point — don't let it through without one.
    var cPhone = $("#cPhone"), cErr = $("#cErr");
    if (cPhone && cPhone.value.replace(/\D/g, "").length < 10) {
      cErr.textContent = shop.lang === "es" ? "Necesitamos tu número para llamarte." : "We need a number to reach you on.";
      cErr.hidden = false;
      cPhone.focus();
      return;
    }

    var pressed = function (group) {
      var row = $('[data-group="' + group + '"]');
      if (!row) return "";
      var on = row.querySelector('.chip[aria-pressed="true"]');
      return on ? on.textContent : "";
    };

    var details = {
      name: $("#cName") ? $("#cName").value.trim().slice(0, 60) : "",
      phone: cPhone ? cPhone.value.trim().slice(0, 24) : "",
    };
    if (kind === "book") {
      details.when = (pressed("day") + " " + pressed("slot")).trim();
      if (shop.barbers) details.staff = pressed("who");
    } else if (kind === "callback") {
      details.when = pressed("when");
      details.note = $("#cbNote") ? $("#cbNote").value.trim().slice(0, 300) : "";
    } else if (kind === "quote") {
      details.note = $("#qText") ? $("#qText").value.trim().slice(0, 500) : "";
    }

    send.disabled = true;
    send.textContent = T.sending;

    var finish = function (delivered) {
      body.hidden = true;
      $("#okTitle").textContent = T[kind === "book" ? "okBookTitle" : kind === "callback" ? "okCbTitle" : "okQuoteTitle"];
      $("#okBody").textContent = delivered
        ? T[kind === "book" ? "okBookBody" : kind === "callback" ? "okCbBody" : "okQuoteBody"]
        : T.okFallback.replace("{phone}", shop.phone || "");
      ok.hidden = false;
      setTimeout(shut, delivered ? 2800 : 5000);
    };

    fetch("/api/request", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ slug: slug, kind: kind, details: details }),
    })
      .then(function (r) { return r.json(); })
      .then(function (d) { finish(!!(d && d.ok)); })
      .catch(function () { finish(false); });
  });

  body.addEventListener("input", function (e) {
    if (e.target.id === "qText") { var err = $("#qErr"); if (err) err.hidden = true; }
  });
})();
</script>
